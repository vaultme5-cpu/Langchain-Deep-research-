name: Omega Zero-Token CI

on:
  push:
  workflow_dispatch:

jobs:
  zero-token:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Step 1 - Syntax check
        run: python -m compileall -q .
      - name: Step 2 - Import check (zero tokens)
        run: |
          python - <<'PY'
          import importlib, importlib.util, os, sys
          sys.path.insert(0, "src")
          mods = [
              "open_deep_research.configuration",
              "open_deep_research.state",
              "open_deep_research.prompts",
              "open_deep_research.omega_errors",
              "open_deep_research.omega_verification",
              "open_deep_research.omega_reporting",
              "open_deep_research.omega_security",
              "open_deep_research.utils",
              "open_deep_research.deep_researcher",
          ]
          fails = 0
          for m in mods:
              try:
                  importlib.import_module(m)
                  print("OK   " + m)
              except Exception as e:
                  fails += 1
                  print("FAIL " + m + " -> " + type(e).__name__ + ": " + str(e)[:300])
          ui = None
          for root, _, files in os.walk("."):
              if "omega_ui.py" in files:
                  ui = os.path.join(root, "omega_ui.py")
                  break
          if ui is None:
              print("WARN omega_ui.py not found")
          else:
              try:
                  spec = importlib.util.spec_from_file_location("omega_ui", ui)
                  mod = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(mod)
                  print("OK   omega_ui (" + ui + ")")
              except Exception as e:
                  fails += 1
                  print("FAIL omega_ui -> " + type(e).__name__ + ": " + str(e)[:300])
          print("IMPORT RESULT: " + ("PASS" if fails == 0 else str(fails) + " FAILURES"))
          sys.exit(1 if fails else 0)
          PY
      - name: Step 3 - Full zero-token certification (auto-discovery)
        run: |
          python - <<'PY'
          import sys, inspect, asyncio
          sys.path.insert(0, "src")
          from open_deep_research import deep_researcher as dr
          from open_deep_research import omega_errors as oe

          KEYWORDS = ("benchmark", "suite", "certification", "proof", "self_test")
          seen = set()
          todo = []
          skipped = []
          for mod in (dr, oe):
              for name in sorted(dir(mod)):
                  if not name.startswith("_run_"):
                      continue
                  if not any(k in name for k in KEYWORDS):
                      continue
                  fn = getattr(mod, name)
                  if not callable(fn) or id(fn) in seen:
                      continue
                  seen.add(id(fn))
                  try:
                      sig = inspect.signature(fn)
                      req = [p.name for p in sig.parameters.values()
                             if p.default is inspect.Parameter.empty and
                             p.kind in (inspect.Parameter.POSITIONAL_OR_KEYWORD,
                                        inspect.Parameter.POSITIONAL_ONLY,
                                        inspect.Parameter.KEYWORD_ONLY)]
                  except (TypeError, ValueError):
                      req = ["?"]
                  if req:
                      skipped.append(name + " (needs args: " + ",".join(req) + ")")
                      continue
                  todo.append((name, fn))

          total_fail = 0
          total_pass = 0
          for name, fn in todo:
              try:
                  if inspect.iscoroutinefunction(fn):
                      r = asyncio.run(fn())
                  else:
                      r = fn()
                  ok = bool(r.get("success", False)) if isinstance(r, dict) else False
                  p = r.get("passed", 0) if isinstance(r, dict) else 0
                  f = r.get("failed", 0) if isinstance(r, dict) else 0
                  total_pass += int(p)
                  total_fail += (0 if ok else 1)
                  print(("PASS " if ok else "FAIL ") + name + " | passed=" + str(p) + " failed=" + str(f))
                  if not ok and isinstance(r, dict):
                      for d in (r.get("details", []) or [])[:15]:
                          print("   " + str(d))
              except Exception as e:
                  total_fail += 1
                  print("CRASH " + name + " -> " + type(e).__name__ + ": " + str(e)[:300])

          print("SKIPPED (need args): " + ("; ".join(skipped) if skipped else "none"))
          print("SUITES RUN: " + str(len(todo)) + " | CHECKS PASSED: " + str(total_pass) + " | SUITE FAILURES: " + str(total_fail))
          print("CERTIFICATION RESULT: " + ("PASS" if total_fail == 0 else "FAIL"))
          sys.exit(1 if total_fail else 0)
          PY
